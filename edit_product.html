<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product | MarketHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<section class="form-section">

    <div class="form-card">

        <h2>
            Edit Product
        </h2>

        <p>
            Update your product information.
        </p>


        <form method="POST">

            <label>
                Product Name
            </label>

            <input
                name="name"
                value="{{ product['name'] }}"
                required
            >


            <label>
                Price per KG
            </label>

            <input
                type="number"
                step="0.01"
                name="price"
                value="{{ product['price'] }}"
                required
            >


            <label>
                Quantity
            </label>

            <input
                type="number"
                step="0.1"
                name="quantity"
                value="{{ product['quantity'] }}"
                required
            >


            <button type="submit">
                Save Changes
            </button>

        </form>

    </div>

</section>


</body>

</html>
