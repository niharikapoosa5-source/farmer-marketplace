<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | MarketHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<section class="form-section">

    <div class="form-card">

        <div class="large-icon">
            🌾
        </div>

        <h2>
            Welcome Back
        </h2>

        <p>
            Login to your MarketHub account.
        </p>


        {% with messages =
            get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                name="phone"
                maxlength="10"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p style="margin-top:20px">

            New user?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</section>


</body>

</html>
